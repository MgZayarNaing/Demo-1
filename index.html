<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-main">
        <p class="title">OUR MENU</p>
        <div class="title-underline"></div>
        <p class="dec">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Corrupti, quidem.</p>
    </div>

    <div class="main">
        <div class="card left">
            <div class="img-box">
                <div class="circle-bg"></div>
                <img src="img1.png" alt="Food Item 1">
            </div>
            <p class="food-title">Ribeye Steak with Roasted Potatoes</p>
            <p class="price">$100</p>
            <button type="button" class="btn">Buy Now</button>
        </div>

        <div class="card center">
            <div class="img-box">
                <div class="circle-bg"></div>
                <img src="img2.png" alt="Food Item 2">
            </div>
            <p class="food-title">Prime Beef Tenderloin</p>
            <p class="price">$120</p>
            <button type="button" class="btn">Buy Now</button>
        </div>

        <div class="card right">
            <div class="img-box">
                <div class="circle-bg"></div>
                <img src="img3.png" alt="Food Item 3">
            </div>
            <p class="food-title">Caprese Salad & Egg Toast</p>
            <p class="price">$95</p>
            <button type="button" class="btn">Buy Now</button>
        </div>
    </div>

</body>
</html>
